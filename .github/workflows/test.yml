name: Run Translator Tests

on:
  push:
    branches: [f25]
  pull_request:
    branches: [f25]
  workflow_dispatch:

jobs:
  mock-tests:
    name: Mock unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run mock tests
        run: python -m pytest test/unit/test_translator.py -v

  live-tests:
    name: Live LLM integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start Ollama and pull model
        run: |
          docker compose up -d ollama
          echo "Waiting for Ollama to be healthy..."
          for i in $(seq 1 60); do
            if docker compose exec ollama ollama list >/dev/null 2>&1; then
              echo "Ollama is ready"
              break
            fi
            echo "  waiting... ($i)"
            sleep 5
          done
          echo "Pulling model..."
          docker compose exec ollama ollama pull deepseek-r1:1.5b
          echo "Model pulled."

      - name: Build and start translator
        run: |
          docker compose up -d --build translator
          echo "Waiting for translator to start..."
          sleep 5

      - name: Run live tests inside translator container
        run: |
          docker compose exec translator python -m pytest test/unit/test_translator_live.py -v -s
