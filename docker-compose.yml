# Full stack: Ollama (LLM) + translator API. Other repos call the translator on port 5000.
# First boot may take several minutes while the model downloads; later starts are fast (volume cache).

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  # One-shot: wait for Ollama API, pull model (idempotent if already cached in volume).
  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Pulling deepseek-r1:1.5b (first run can take a while)..."
        ollama pull deepseek-r1:1.5b
        echo "Model ready."
    restart: "no"

  translator:
    build: .
    ports:
      - "5000:5000"
    environment:
      FLASK_APP: app.py
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: deepseek-r1:1.5b
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  ollama_data:
